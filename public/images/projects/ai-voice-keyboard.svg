<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="voice-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="ai-pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="voice-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#voice-bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#818cf8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Top Title Tag -->
  <rect x="24" y="18" width="220" height="26" rx="13" fill="rgba(168, 85, 247, 0.25)" stroke="#c084fc" stroke-opacity="0.5"/>
  <text x="134" y="35" fill="#f5d0fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🎙️ AI VOICE TYPING &amp; TRANSLATOR</text>

  <!-- Left: Live Voice Waveform & Speech Input Card -->
  <g transform="translate(35, 55)">
    <!-- Chat Speech Bubble -->
    <rect width="250" height="95" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#voice-glow)"/>
    <text x="16" y="26" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="700">REAL-TIME SPEECH DICTATION</text>
    <text x="16" y="52" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="500">"Schedule a QA team sync for tomorrow at 10 AM..."</text>
    
    <!-- AI Action Chips -->
    <g transform="translate(16, 64)">
      <rect width="64" height="20" rx="10" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1"/>
      <text x="32" y="77" fill="#93c5fd" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">✨ Polish</text>
      
      <rect x="70" width="70" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.3" stroke="#c084fc" stroke-width="1"/>
      <text x="105" y="77" fill="#e9d5ff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🌐 Translate</text>

      <rect x="146" width="60" height="20" rx="10" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="1"/>
      <text x="176" y="77" fill="#a7f3d0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">📝 Summarize</text>
    </g>

    <!-- Glowing Animated Waveform Microphone Station -->
    <g transform="translate(0, 115)">
      <rect width="250" height="130" rx="16" fill="#0f172a" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
      <text x="125" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">LISTENING (MULTILINGUAL STT)</text>
      
      <!-- Colorful Waveform Bars -->
      <g transform="translate(45, 45)">
        <rect x="0" y="20" width="5" height="20" rx="2.5" fill="#38bdf8"/>
        <rect x="12" y="10" width="5" height="40" rx="2.5" fill="#818cf8"/>
        <rect x="24" y="0" width="5" height="60" rx="2.5" fill="#c084fc"/>
        <rect x="36" y="8" width="5" height="45" rx="2.5" fill="#f43f5e"/>
        <rect x="48" y="15" width="5" height="30" rx="2.5" fill="#fb923c"/>
        <rect x="60" y="4" width="5" height="52" rx="2.5" fill="#34d399"/>
        <rect x="72" y="12" width="5" height="36" rx="2.5" fill="#22d3ee"/>
        <rect x="84" y="2" width="5" height="56" rx="2.5" fill="#a855f7"/>
        <rect x="96" y="16" width="5" height="28" rx="2.5" fill="#ec4899"/>
        <rect x="108" y="8" width="5" height="44" rx="2.5" fill="#38bdf8"/>
        <rect x="120" y="22" width="5" height="16" rx="2.5" fill="#818cf8"/>
        <rect x="132" y="14" width="5" height="32" rx="2.5" fill="#34d399"/>
        <rect x="144" y="24" width="5" height="12" rx="2.5" fill="#f43f5e"/>
      </g>

      <text x="125" y="118" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Antigravity Automation: Zero Latency</text>
    </g>
  </g>

  <!-- Right: Colorful Soft Keyboard Preview -->
  <g transform="translate(305, 55)">
    <rect width="300" height="245" rx="16" fill="#0b0f19" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Keyboard AI Toolbar -->
    <rect x="10" y="10" width="280" height="36" rx="8" fill="#1e1b4b" stroke="url(#ai-pill)" stroke-width="1"/>
    <text x="24" y="32" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="700">🤖 AI Keyboard Assistant</text>
    <rect x="210" y="16" width="70" height="24" rx="6" fill="#6366f1"/>
    <text x="245" y="32" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✨ Tone Rewrite</text>

    <!-- Key Rows -->
    <g transform="translate(10, 56)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="28" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="56" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="84" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="112" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="140" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="168" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="196" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="224" y="0" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="252" y="0" width="28" height="34" rx="5" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1"/>
      <text x="266" y="22" fill="#fda4af" font-family="sans-serif" font-size="10" text-anchor="middle">⌫</text>

      <!-- Row 2 -->
      <rect x="14" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="42" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="70" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="98" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="126" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="154" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="182" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="210" y="42" width="25" height="34" rx="5" fill="#1e293b"/>
      <rect x="238" y="42" width="34" height="34" rx="5" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1"/>
      <text x="255" y="64" fill="#93c5fd" font-family="sans-serif" font-size="10" text-anchor="middle">⏎</text>

      <!-- Spacebar Row with Colorful Mic Button -->
      <rect x="0" y="84" width="40" height="34" rx="5" fill="#334155"/>
      <text x="20" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">?123</text>
      
      <rect x="46" y="84" width="130" height="34" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="111" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">English (US)</text>
      
      <!-- Vibrant Mic Button -->
      <rect x="182" y="84" width="50" height="34" rx="8" fill="#6366f1" stroke="#a5b4fc" stroke-width="1.5" filter="url(#voice-glow)"/>
      <circle cx="207" cy="101" r="10" fill="#4f46e5"/>
      <path d="M207 96v6 M204 100a3 3 0 0 0 6 0" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

      <rect x="238" y="84" width="42" height="34" rx="5" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="1"/>
      <text x="259" y="105" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">🌍</text>
    </g>

    <!-- Bottom SQA Pass Ribbon -->
    <rect x="10" y="196" width="280" height="36" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="150" y="218" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">✓ SQA VERIFIED: Google Play Live</text>
  </g>
</svg>
