<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" fill="none">
  <defs>
    <linearGradient id="bg-voice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081418" />
      <stop offset="100%" stop-color="#0e2329" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg-voice)"/>
  <rect x="1" y="1" width="598" height="338" rx="11" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Subtle Waveform Animation Graphic -->
  <g transform="translate(180, 70)">
    <rect width="240" height="60" rx="30" fill="#0b1e24" stroke="#14b8a6" stroke-opacity="0.3"/>
    <!-- Audio Wave Bars -->
    <rect x="40" y="24" width="4" height="12" rx="2" fill="#2dd4bf"/>
    <rect x="52" y="18" width="4" height="24" rx="2" fill="#5eead4"/>
    <rect x="64" y="12" width="4" height="36" rx="2" fill="#2dd4bf"/>
    <rect x="76" y="8" width="4" height="44" rx="2" fill="#14b8a6"/>
    <rect x="88" y="16" width="4" height="28" rx="2" fill="#5eead4"/>
    <rect x="100" y="22" width="4" height="16" rx="2" fill="#2dd4bf"/>
    <rect x="112" y="10" width="4" height="40" rx="2" fill="#14b8a6"/>
    <rect x="124" y="14" width="4" height="32" rx="2" fill="#5eead4"/>
    <rect x="136" y="20" width="4" height="20" rx="2" fill="#2dd4bf"/>
    <rect x="148" y="24" width="4" height="12" rx="2" fill="#14b8a6"/>
    
    <circle cx="195" cy="30" r="16" fill="#14b8a6" fill-opacity="0.2" stroke="#2dd4bf" stroke-width="1.5"/>
    <path d="M195 22v10m-3-6a3 3 0 0 0 6 0" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Keyboard Layout Mockup Preview -->
  <g transform="translate(150, 155)">
    <rect width="300" height="135" rx="10" fill="#061216" stroke="#2dd4bf" stroke-opacity="0.25"/>
    <!-- Keys Grid -->
    <rect x="15" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="42" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="69" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="96" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="123" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="150" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="177" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="204" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="231" y="15" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="258" y="15" width="26" height="26" rx="4" fill="#14b8a6" fill-opacity="0.3"/>

    <!-- Row 2 -->
    <rect x="25" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="52" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="79" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="106" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="133" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="160" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="187" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="214" y="47" width="22" height="26" rx="4" fill="#0f262d"/>
    <rect x="241" y="47" width="34" height="26" rx="4" fill="#0f262d"/>

    <!-- Spacebar & Voice Key -->
    <rect x="65" y="80" width="130" height="26" rx="4" fill="#0d2229"/>
    <rect x="200" y="80" width="40" height="26" rx="4" fill="#14b8a6" fill-opacity="0.4"/>
    <text x="220" y="97" fill="#5eead4" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MIC</text>
    <rect x="245" y="80" width="40" height="26" rx="4" fill="#10b981" fill-opacity="0.3"/>
    <text x="265" y="97" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">IME</text>
  </g>

  <!-- Floating QA Badge -->
  <g transform="translate(420, 35)">
    <rect width="130" height="42" rx="8" fill="#0b1f26" stroke="#2dd4bf" stroke-opacity="0.3"/>
    <text x="14" y="20" fill="#5eead4" font-family="monospace" font-size="10" font-weight="700">AUDIO &amp; IME QA</text>
    <text x="14" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Zero Latency Drop</text>
  </g>
</svg>
