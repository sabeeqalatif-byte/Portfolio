<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" fill="none">
  <defs>
    <linearGradient id="bg-trans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151a" />
      <stop offset="100%" stop-color="#0d242a" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg-trans)"/>
  <rect x="1" y="1" width="598" height="338" rx="11" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Two Language Bubble UI Cards -->
  <g transform="translate(130, 50)">
    <!-- Source Language Bubble -->
    <rect width="340" height="90" rx="12" fill="#0c2229" stroke="#14b8a6" stroke-opacity="0.3"/>
    <rect x="16" y="16" width="60" height="20" rx="4" fill="rgba(20, 184, 166, 0.15)"/>
    <text x="46" y="30" fill="#5eead4" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ENGLISH</text>
    <text x="16" y="60" fill="#f0fdfa" font-family="sans-serif" font-size="14" font-weight="500">"Where is the nearest subway station?"</text>
    <circle cx="305" cy="45" r="14" fill="#0e2a33" stroke="#2dd4bf" stroke-width="1.5"/>
    <path d="M302 40v10l7-5-7-5z" fill="#2dd4bf"/>
  </g>

  <!-- Exchange / Translation Arrow Node -->
  <g transform="translate(280, 148)">
    <circle cx="20" cy="20" r="18" fill="#14b8a6" fill-opacity="0.2" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M14 18l6-4v8m6-2l-6 4v-8" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Target Language Bubble -->
  <g transform="translate(130, 195)">
    <rect width="340" height="90" rx="12" fill="#081a20" stroke="#2dd4bf" stroke-opacity="0.4"/>
    <rect x="16" y="16" width="60" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="46" y="30" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">SPANISH</text>
    <text x="16" y="60" fill="#ccfbf1" font-family="sans-serif" font-size="14" font-weight="500">"¿Dónde está la estación de metro más cercana?"</text>
    <circle cx="305" cy="45" r="14" fill="#0e2a33" stroke="#10b981" stroke-width="1.5"/>
    <path d="M302 40v10l7-5-7-5z" fill="#10b981"/>
  </g>

  <!-- Floating QA Badge -->
  <g transform="translate(30, 130)">
    <rect width="115" height="42" rx="8" fill="#0c2027" stroke="#2dd4bf" stroke-opacity="0.25"/>
    <text x="12" y="19" fill="#5eead4" font-family="monospace" font-size="9" font-weight="700">API SYNC QA</text>
    <text x="12" y="33" fill="#94a3b8" font-family="sans-serif" font-size="10">Payload Validated</text>
  </g>
</svg>
