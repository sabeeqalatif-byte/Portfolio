<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="spell-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="spell-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#spell-bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#c084fc" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Top Title Tag -->
  <rect x="24" y="18" width="220" height="26" rx="13" fill="rgba(236, 72, 153, 0.25)" stroke="#f472b6" stroke-opacity="0.5"/>
  <text x="134" y="35" fill="#fbcfe8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🗣️ PRONOUNCE &amp; SPELL CHECKER AI</text>

  <!-- Left: Phonetic Waveform & Accent Trainer -->
  <g transform="translate(35, 55)">
    <rect width="260" height="250" rx="18" fill="#18112e" stroke="#a855f7" stroke-width="1.8" filter="url(#spell-glow)"/>
    
    <!-- Accent Flags Selector -->
    <g transform="translate(16, 16)">
      <rect width="68" height="26" rx="13" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
      <text x="34" y="33" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🇺🇸 US</text>

      <rect x="76" width="68" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="110" y="33" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🇬🇧 UK</text>

      <rect x="152" width="68" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="186" y="33" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🇦🇺 AUS</text>
    </g>

    <!-- Word Display & Phonetic Breakdown -->
    <text x="16" y="78" fill="#f472b6" font-family="sans-serif" font-size="18" font-weight="bold">Sophisticated</text>
    <text x="16" y="98" fill="#38bdf8" font-family="monospace" font-size="12">/səˈfɪs.tɪ.keɪ.tɪd/</text>

    <!-- Voice Recording Wave Analyzer -->
    <rect x="16" y="115" width="228" height="70" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <g transform="translate(26, 135)">
      <rect x="0" y="8" width="4" height="24" rx="2" fill="#f43f5e"/>
      <rect x="10" y="2" width="4" height="36" rx="2" fill="#ec4899"/>
      <rect x="20" y="14" width="4" height="12" rx="2" fill="#a855f7"/>
      <rect x="30" y="0" width="4" height="40" rx="2" fill="#6366f1"/>
      <rect x="40" y="6" width="4" height="28" rx="2" fill="#38bdf8"/>
      <rect x="50" y="12" width="4" height="16" rx="2" fill="#34d399"/>
      <rect x="60" y="0" width="4" height="40" rx="2" fill="#6366f1"/>
      <rect x="70" y="4" width="4" height="32" rx="2" fill="#ec4899"/>
      <rect x="80" y="14" width="4" height="12" rx="2" fill="#f43f5e"/>
      <rect x="90" y="2" width="4" height="36" rx="2" fill="#a855f7"/>
      <rect x="100" y="8" width="4" height="24" rx="2" fill="#38bdf8"/>
      <rect x="110" y="0" width="4" height="40" rx="2" fill="#34d399"/>
      <rect x="120" y="10" width="4" height="20" rx="2" fill="#6366f1"/>
      <rect x="130" y="4" width="4" height="32" rx="2" fill="#ec4899"/>
      <rect x="140" y="16" width="4" height="8" rx="2" fill="#f43f5e"/>
    </g>
    <text x="130" y="176" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">STT Pronunciation Accuracy: 99.4%</text>

    <!-- Tap to Listen Action Button -->
    <g transform="translate(16, 196)">
      <rect width="228" height="38" rx="10" fill="url(#spell-bg)" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="28" cy="19" r="11" fill="#ec4899"/>
      <path d="M25 15v8l6-4-6-4z" fill="#fff"/>
      <text x="50" y="23" fill="#fbcfe8" font-family="sans-serif" font-size="11" font-weight="bold">Play Native TTS Audio</text>
    </g>
  </g>

  <!-- Right: Spell Checker & Compliance Card -->
  <g transform="translate(315, 55)">
    <!-- Spell Check Live Correction Card -->
    <rect width="290" height="115" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#spell-glow)"/>
    <text x="18" y="26" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">AI SMART SPELL-CHECK</text>
    
    <text x="18" y="52" fill="#f8fafc" font-family="sans-serif" font-size="13">
      "She has great <tspan fill="#f43f5e" text-decoration="underline">resilence</tspan> in work."
    </text>

    <g transform="translate(18, 68)">
      <rect width="140" height="30" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.2"/>
      <text x="12" y="20" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold">✓ Correct: resilience</text>
    </g>

    <!-- SQA Compliance Badge -->
    <g transform="translate(0, 130)">
      <rect width="290" height="120" rx="16" fill="#18112e" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2"/>
      <text x="18" y="24" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">SQA COMPLIANCE &amp; RETROFIT</text>
      
      <g transform="translate(18, 38)">
        <circle cx="6" cy="6" r="5" fill="#10b981"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">App Tracking Transparency (ATT) Passed</text>
      </g>

      <g transform="translate(18, 60)">
        <circle cx="6" cy="6" r="5" fill="#10b981"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">GDPR User Consent Protocol Verified</text>
      </g>

      <g transform="translate(18, 82)">
        <circle cx="6" cy="6" r="5" fill="#10b981"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">iOS 15+ Retrofitting &amp; IAP Monetization</text>
      </g>
    </g>
  </g>
</svg>
