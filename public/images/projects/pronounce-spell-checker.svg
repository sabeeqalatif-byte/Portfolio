<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" fill="none">
  <defs>
    <linearGradient id="bg-spell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081418" />
      <stop offset="100%" stop-color="#0d242c" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg-spell)"/>
  <rect x="1" y="1" width="598" height="338" rx="11" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Pronunciation Waveform & Accent Selector Card -->
  <g transform="translate(130, 45)">
    <rect width="340" height="110" rx="12" fill="#0b2027" stroke="#2dd4bf" stroke-opacity="0.3"/>
    
    <!-- Accent Tags -->
    <rect x="18" y="15" width="48" height="22" rx="4" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-opacity="0.4"/>
    <text x="42" y="30" fill="#5eead4" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">🇺🇸 US</text>
    
    <rect x="72" y="15" width="48" height="22" rx="4" fill="#0c1f26"/>
    <text x="96" y="30" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">🇬🇧 UK</text>

    <rect x="126" y="15" width="48" height="22" rx="4" fill="#0c1f26"/>
    <text x="150" y="30" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">🇦🇺 AUS</text>

    <!-- Phonetic breakdown -->
    <text x="18" y="65" fill="#f0fdfa" font-family="sans-serif" font-size="16" font-weight="700">"Sophisticated"</text>
    <text x="18" y="85" fill="#2dd4bf" font-family="monospace" font-size="11">so·​phis·​ti·​cat·​ed • /səˈfɪs.tɪ.keɪ.tɪd/</text>

    <!-- TTS / STT Quality Score Badge -->
    <circle cx="300" cy="55" r="22" fill="#0e2a33" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="52" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">STT</text>
    <text x="300" y="66" fill="#10b981" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">100%</text>
  </g>

  <!-- Compliance & Privacy Card (ATT & GDPR) -->
  <g transform="translate(130, 175)">
    <rect width="340" height="110" rx="12" fill="#08181f" stroke="#14b8a6" stroke-opacity="0.3"/>
    
    <text x="20" y="32" fill="#5eead4" font-family="monospace" font-size="11" font-weight="700">COMPLIANCE &amp; PRIVACY AUDIT</text>
    
    <!-- Checklist items -->
    <g transform="translate(20, 48)">
      <circle cx="6" cy="6" r="5" fill="#10b981"/>
      <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
      <text x="18" y="10" fill="#f0fdfa" font-family="sans-serif" font-size="11">App Tracking Transparency (ATT) iOS 15+ Verified</text>
    </g>

    <g transform="translate(20, 72)">
      <circle cx="6" cy="6" r="5" fill="#10b981"/>
      <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
      <text x="18" y="10" fill="#f0fdfa" font-family="sans-serif" font-size="11">GDPR &amp; Consent Management Platform (CMP) Compliant</text>
    </g>

    <g transform="translate(20, 96)">
      <circle cx="6" cy="6" r="5" fill="#10b981"/>
      <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
      <text x="18" y="10" fill="#f0fdfa" font-family="sans-serif" font-size="11">Postman REST API Endpoints Status 200 OK</text>
    </g>
  </g>
</svg>
