<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="dict-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dict-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#dict-bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Top Title Tag -->
  <rect x="24" y="18" width="230" height="26" rx="13" fill="rgba(16, 185, 129, 0.25)" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="139" y="35" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📖 ADVANCED ENGLISH DICTIONARY</text>

  <!-- Left: iPhone Offline Dictionary Entry Screen -->
  <g transform="translate(35, 55)">
    <rect width="260" height="255" rx="18" fill="#0b1b17" stroke="#10b981" stroke-width="2" filter="url(#dict-glow)"/>
    
    <!-- Search Bar with OCR Camera Icon -->
    <rect x="14" y="14" width="232" height="34" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="35" fill="#d1fae5" font-family="sans-serif" font-size="11">🔍 "Persistence" | 📷</text>
    <circle cx="230" cy="31" r="10" fill="#10b981"/>
    <text x="230" y="35" fill="#fff" font-family="sans-serif" font-size="10" text-anchor="middle">📸</text>

    <!-- Definition Card -->
    <g transform="translate(14, 58)">
      <rect width="232" height="135" rx="12" fill="#022c22" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
      <text x="14" y="24" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">Persistence</text>
      <text x="14" y="40" fill="#6ee7b7" font-family="monospace" font-size="10">/pəˈsɪs.təns/ • noun</text>
      
      <!-- TTS Play Button -->
      <circle cx="205" cy="24" r="12" fill="#10b981" filter="url(#dict-glow)"/>
      <path d="M201 19v10l8-5-8-5z" fill="#fff"/>

      <text x="14" y="62" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="500">Firm or obstinate continuance in a course of action in spite of difficulty.</text>

      <!-- Synonyms Tags -->
      <g transform="translate(14, 98)">
        <rect width="58" height="18" rx="4" fill="#047857"/>
        <text x="29" y="110" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">tenacity</text>
        
        <rect x="64" width="62" height="18" rx="4" fill="#047857"/>
        <text x="95" y="110" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">endurance</text>
        
        <rect x="132" width="62" height="18" rx="4" fill="#047857"/>
        <text x="163" y="110" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">grit</text>
      </g>
    </g>

    <!-- Offline SQLite Status Tag -->
    <rect x="14" y="206" width="232" height="34" rx="8" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="1"/>
    <text x="130" y="227" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">⚡ 350,000+ Words (100% Offline SQLite)</text>
  </g>

  <!-- Right: iOS Home Screen Widget & Multi-device Sync -->
  <g transform="translate(315, 55)">
    <!-- iOS Word of the Day Widget -->
    <rect width="290" height="115" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#dict-glow)"/>
    <text x="18" y="24" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">iOS HOME SCREEN WIDGET</text>
    <text x="18" y="48" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Word of the Day: <tspan fill="#34d399">Serendipity</tspan></text>
    <text x="18" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="11">The occurrence of events by chance in a happy or beneficial way.</text>
    <rect x="18" y="86" width="110" height="18" rx="4" fill="#0284c7" fill-opacity="0.3"/>
    <text x="73" y="99" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">✓ Auto-Sync Verified</text>

    <!-- SQA App Store / Google Play Validation Card -->
    <g transform="translate(0, 130)">
      <rect width="290" height="125" rx="16" fill="#064e3b" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2"/>
      <text x="18" y="24" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold">SQA TEST VERIFICATION</text>
      
      <g transform="translate(18, 38)">
        <circle cx="6" cy="6" r="5" fill="#34d399"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">Camera OCR Text Recognition Accuracy</text>
      </g>

      <g transform="translate(18, 60)">
        <circle cx="6" cy="6" r="5" fill="#34d399"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">TTS Variable Playback Speed (0.5x - 2.0x)</text>
      </g>

      <g transform="translate(18, 82)">
        <circle cx="6" cy="6" r="5" fill="#34d399"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">In-App Subscriptions &amp; Ad Removal OK</text>
      </g>
    </g>
  </g>
</svg>
