<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="diary-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="diary-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#diary-bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#f472b6" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Top Title Tag -->
  <rect x="24" y="18" width="220" height="26" rx="13" fill="rgba(244, 114, 182, 0.25)" stroke="#f472b6" stroke-opacity="0.5"/>
  <text x="134" y="35" fill="#fbcfe8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔒 PERSONAL DIARY WITH LOCK</text>

  <!-- Left: Daily Journal Entry Card -->
  <g transform="translate(35, 55)">
    <rect width="260" height="255" rx="18" fill="#1e102f" stroke="#c084fc" stroke-width="1.8" filter="url(#diary-glow)"/>
    
    <!-- Header with Date & Mood Tag -->
    <g transform="translate(16, 14)">
      <text x="0" y="16" fill="#fbcfe8" font-family="sans-serif" font-size="13" font-weight="bold">August 30 &bull; Daily Log</text>
      
      <!-- Mood Emojis -->
      <rect x="160" y="0" width="68" height="24" rx="12" fill="#ec4899" fill-opacity="0.3" stroke="#f472b6" stroke-width="1"/>
      <text x="194" y="16" fill="#fff" font-family="sans-serif" font-size="11" text-anchor="middle">✨ Happy</text>
    </g>

    <!-- Journal Content Area -->
    <g transform="translate(16, 50)">
      <rect width="228" height="135" rx="12" fill="#10081d" stroke="#6b21a8" stroke-width="1"/>
      <text x="12" y="24" fill="#fdf2f8" font-family="sans-serif" font-size="12" font-weight="bold">"Successful Sprint Release"</text>
      <text x="12" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="normal">All test suites passed 100%. Released version 2.4 to App Store and Google Play with zero regressions.</text>
      
      <!-- Photo Attachment Mockup -->
      <rect x="12" y="78" width="55" height="42" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1"/>
      <text x="39" y="103" fill="#fbcfe8" font-family="sans-serif" font-size="16" text-anchor="middle">📷</text>

      <rect x="74" y="78" width="55" height="42" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
      <text x="101" y="103" fill="#e9d5ff" font-family="sans-serif" font-size="16" text-anchor="middle">📊</text>

      <rect x="136" y="78" width="80" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="176" y="103" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">+ 4 Tags</text>
    </g>

    <!-- SQLite Encryption Tag -->
    <rect x="16" y="202" width="228" height="36" rx="8" fill="rgba(168, 85, 247, 0.2)" stroke="#c084fc" stroke-width="1"/>
    <text x="130" y="224" fill="#e9d5ff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">🛡️ 256-Bit SQLite Local Encryption</text>
  </g>

  <!-- Right: Biometric Fingerprint & Security Verification -->
  <g transform="translate(315, 55)">
    <rect width="290" height="255" rx="18" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="18" y="28" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">BIOMETRIC SECURITY GATE</text>
    
    <!-- Fingerprint Icon & Status -->
    <g transform="translate(18, 45)">
      <rect width="254" height="110" rx="14" fill="#1e102f" stroke="#ec4899" stroke-width="1.5" filter="url(#diary-glow)"/>
      <circle cx="50" cy="55" r="28" fill="#831843" stroke="#f472b6" stroke-width="2"/>
      <text x="50" y="62" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle">👆</text>

      <text x="90" y="48" fill="#fdf2f8" font-family="sans-serif" font-size="13" font-weight="bold">FaceID / TouchID Lock</text>
      <text x="90" y="68" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">✓ AUTHENTICATED</text>
      <text x="90" y="86" fill="#cbd5e1" font-family="sans-serif" font-size="9">PIN &amp; Biometric Fallback Verified</text>
    </g>

    <!-- SQA Audits Checklist -->
    <g transform="translate(18, 170)">
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="5" fill="#34d399"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">Zero Data Leakage on App Switcher</text>
      </g>

      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="5" fill="#34d399"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">Cloud Drive Backup &amp; Recovery Tested</text>
      </g>

      <g transform="translate(0, 48)">
        <circle cx="6" cy="6" r="5" fill="#34d399"/>
        <path d="M4 6l1.5 1.5 3-3" stroke="#fff" stroke-width="1.2"/>
        <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10">In-App Purchases Theme Unlock Audited</text>
      </g>
    </g>
  </g>
</svg>
