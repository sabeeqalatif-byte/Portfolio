<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="math-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Phone Bezel Gradient -->
    <linearGradient id="phone-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(236,72,153,0)" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="rgba(236,72,153,0)" />
    </linearGradient>

    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="16" fill="url(#math-bg)" />
  <circle cx="120" cy="80" r="180" fill="#6366f1" fill-opacity="0.15" />
  <circle cx="620" cy="320" r="160" fill="#38bdf8" fill-opacity="0.12" />

  <!-- Left: Real Mobile Phone Frame -->
  <g transform="translate(45, 30)" filter="url(#shadow-main)">
    <!-- Device Body -->
    <rect width="210" height="340" rx="32" fill="#090d16" stroke="url(#phone-bezel)" stroke-width="3" />
    
    <!-- Dynamic Island / Speaker -->
    <rect x="75" y="12" width="60" height="14" rx="7" fill="#000" />
    <circle cx="120" cy="19" r="3" fill="#1e293b" />

    <!-- Screen Content: Scanner Viewfinder -->
    <g transform="translate(15, 38)">
      <!-- Viewfinder Area -->
      <rect width="180" height="135" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" />
      
      <!-- Bounding Box Corners -->
      <path d="M12 28v-16h16 M168 28v-16h-16 M12 107v16h16 M168 107v16h-16" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
      
      <!-- Scanning Laser -->
      <line x1="12" y1="68" x2="168" y2="68" stroke="url(#laser-grad)" stroke-width="3" />

      <!-- Mathematical Equation Scanned -->
      <text x="90" y="60" fill="#ffffff" font-family="serif" font-size="18" font-style="italic" font-weight="bold" text-anchor="middle">
        ∫ (3x² + 6x) dx
      </text>

      <!-- OCR Confidence Tag -->
      <rect x="25" y="95" width="130" height="22" rx="11" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1" />
      <text x="90" y="110" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
        ✓ OCR ACCURACY 99.8%
      </text>

      <!-- Shutter Snap Button -->
      <circle cx="90" cy="195" r="28" fill="#6366f1" stroke="#a5b4fc" stroke-width="3" />
      <circle cx="90" cy="195" r="22" fill="#4f46e5" />
      <circle cx="90" cy="195" r="8" fill="#ffffff" />
      <text x="90" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Auto-Scan Equation</text>
    </g>
  </g>

  <!-- Right: Colorful Step-by-Step Derivation Card & Graph -->
  <g transform="translate(290, 35)" filter="url(#shadow-main)">
    
    <!-- Top Result Banner -->
    <rect width="385" height="90" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <g transform="translate(22, 18)">
      <text x="0" y="14" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">INSTANT AI SOLUTION</text>
      <text x="0" y="48" fill="#38bdf8" font-family="monospace" font-size="26" font-weight="bold">x³ + 3x² + C</text>
      
      <!-- Green Verified Check Badge -->
      <circle cx="320" cy="24" r="18" fill="#10b981" />
      <path d="M312 24l6 6 11-11" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Derivation Steps Card -->
    <g transform="translate(0, 105)">
      <rect width="385" height="145" rx="18" fill="#0f172a" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
      
      <text x="22" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">STEP-BY-STEP BREAKDOWN</text>
      
      <!-- Step 1 -->
      <g transform="translate(22, 42)">
        <circle cx="10" cy="10" r="10" fill="#6366f1" />
        <text x="10" y="14" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
        <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="12">Integrate terms separately: <tspan fill="#a5b4fc" font-weight="bold">∫ 3x² dx + ∫ 6x dx</tspan></text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(22, 74)">
        <circle cx="10" cy="10" r="10" fill="#3b82f6" />
        <text x="10" y="14" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>
        <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="12">Apply power rule: <tspan fill="#38bdf8" font-weight="bold">3(x³/3) + 6(x²/2) = x³ + 3x²</tspan></text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(22, 106)">
        <circle cx="10" cy="10" r="10" fill="#10b981" />
        <text x="10" y="14" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
        <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="12">Add integration constant: <tspan fill="#34d399" font-weight="bold">+ C</tspan></text>
      </g>
    </g>

    <!-- Bottom Store Verified Ribbon -->
    <g transform="translate(0, 262)">
      <rect width="385" height="42" rx="12" fill="rgba(52, 211, 153, 0.18)" stroke="#34d399" stroke-width="1.5" />
      <text x="22" y="26" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">
        ✓ SQA AUDIT: App Store &amp; Play Store Verified
      </text>
    </g>

  </g>
</svg>
