<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" fill="none">
  <defs>
    <linearGradient id="bg-maths" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a1f" />
      <stop offset="100%" stop-color="#0e262e" />
    </linearGradient>
    <linearGradient id="teal-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg-maths)"/>
  <rect x="1" y="1" width="598" height="338" rx="11" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M40 0v340M120 0v340M200 0v340M280 0v340M360 0v340M440 0v340M520 0v340M0 60h600M0 140h600M0 220h600M0 300h600" stroke="#14b8a6" stroke-opacity="0.05" stroke-width="1"/>
  
  <!-- Mobile Frame Mockup -->
  <rect x="230" y="40" width="140" height="260" rx="18" fill="#081216" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="270" y="48" width="60" height="4" rx="2" fill="#2dd4bf" fill-opacity="0.4"/>
  
  <!-- Math OCR Scanner UI Graphic -->
  <rect x="245" y="70" width="110" height="70" rx="8" fill="#0f262d" stroke="#14b8a6" stroke-opacity="0.4"/>
  <text x="300" y="112" fill="#5eead4" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">f(x) = ∫ 2x dx</text>
  
  <!-- QA Validation Badge -->
  <rect x="245" y="155" width="110" height="24" rx="4" fill="rgba(20, 184, 166, 0.15)" stroke="#2dd4bf" stroke-opacity="0.4"/>
  <text x="300" y="171" fill="#2dd4bf" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">OCR Verified: 99.8%</text>

  <!-- Math Steps Result -->
  <rect x="245" y="190" width="110" height="90" rx="6" fill="#0b1b20"/>
  <text x="255" y="210" fill="#99f6e4" font-family="sans-serif" font-size="9" font-weight="600">Step 1: Apply Power Rule</text>
  <text x="255" y="228" fill="#ccfbf1" font-family="sans-serif" font-size="11" font-weight="700">Result: x² + C</text>
  <circle cx="340" cy="225" r="7" fill="#10b981"/>
  <path d="M337 225l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left/Right Floating QA Badges -->
  <g transform="translate(60, 120)">
    <rect width="130" height="45" rx="8" fill="#0c2027" stroke="#2dd4bf" stroke-opacity="0.25"/>
    <text x="15" y="22" fill="#5eead4" font-family="monospace" font-size="10" font-weight="700">MOBILE QA</text>
    <text x="15" y="37" fill="#94a3b8" font-family="sans-serif" font-size="11">Android Real Device</text>
  </g>

  <g transform="translate(410, 160)">
    <rect width="130" height="45" rx="8" fill="#0c2027" stroke="#2dd4bf" stroke-opacity="0.25"/>
    <text x="15" y="22" fill="#2dd4bf" font-family="monospace" font-size="10" font-weight="700">TEST STATUS</text>
    <text x="15" y="37" fill="#94a3b8" font-family="sans-serif" font-size="11">Passed &amp; Verified</text>
  </g>
</svg>
