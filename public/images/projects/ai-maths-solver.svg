<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="math-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="phone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="glow-math" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="360" rx="16" fill="url(#math-grad)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="url(#accent-rainbow)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Top Banner Headline -->
  <rect x="24" y="20" width="180" height="26" rx="13" fill="rgba(99, 102, 241, 0.25)" stroke="#818cf8" stroke-opacity="0.5"/>
  <text x="114" y="37" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📷 SCAN &amp; SOLVE IN SECONDS</text>

  <!-- Center Left: Mobile Frame Mockup (Camera Viewfinder) -->
  <g transform="translate(40, 60)">
    <rect width="180" height="270" rx="20" fill="url(#phone-grad)" stroke="#6366f1" stroke-width="2.5"/>
    <rect x="65" y="8" width="50" height="4" rx="2" fill="#475569"/>
    
    <!-- Camera Viewfinder Box with Glowing Corners -->
    <rect x="15" y="30" width="150" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <path d="M15 45v-15h15 M165 45v-15h-15 M15 125v15h15 M165 125v15h-15" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="15" y1="85" x2="165" y2="85" stroke="#ec4899" stroke-width="2" opacity="0.85" filter="url(#glow-math)"/>

    <!-- Math Equation Scanned -->
    <text x="90" y="75" fill="#f8fafc" font-family="serif" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle">∫ (3x² + 2x) dx</text>
    
    <!-- OCR Recognized Tag -->
    <rect x="35" y="100" width="110" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
    <text x="90" y="112" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">✓ OCR CONFIDENCE 99.8%</text>

    <!-- Scan Button -->
    <circle cx="90" cy="200" r="24" fill="#6366f1" stroke="#a5b4fc" stroke-width="3" filter="url(#glow-math)"/>
    <circle cx="90" cy="200" r="19" fill="#4f46e5"/>
    <path d="M82 200h16 M90 192v16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="90" y="242" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Tap to Scan</text>
  </g>

  <!-- Right: Step-by-Step Interactive Solution Cards -->
  <g transform="translate(245, 55)">
    <!-- Card 1: Main Answer Badge -->
    <rect width="360" height="75" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" filter="url(#glow-math)"/>
    <text x="20" y="28" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700">FINAL SOLUTION</text>
    <text x="20" y="58" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="bold">x³ + x² + C</text>
    <circle cx="320" cy="38" r="16" fill="#10b981"/>
    <path d="M313 38l5 5 9-9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Card 2: Step-by-Step Breakdown -->
    <g transform="translate(0, 88)">
      <rect width="360" height="120" rx="14" fill="#0f172a" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2"/>
      <text x="18" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">STEP-BY-STEP EXPLANATION</text>
      
      <!-- Step 1 -->
      <circle cx="28" cy="48" r="8" fill="#6366f1"/>
      <text x="28" y="51" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1</text>
      <text x="44" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="11">Apply power rule: ∫ xⁿ dx = (xⁿ⁺¹)/(n+1)</text>

      <!-- Step 2 -->
      <circle cx="28" cy="74" r="8" fill="#6366f1"/>
      <text x="28" y="77" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2</text>
      <text x="44" y="78" fill="#f1f5f9" font-family="sans-serif" font-size="11">∫ 3x² dx = 3(x³/3) = <tspan fill="#38bdf8" font-weight="bold">x³</tspan></text>

      <!-- Step 3 -->
      <circle cx="28" cy="100" r="8" fill="#6366f1"/>
      <text x="28" y="103" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">3</text>
      <text x="44" y="104" fill="#f1f5f9" font-family="sans-serif" font-size="11">Add constant of integration: <tspan fill="#34d399" font-weight="bold">+ C</tspan></text>
    </g>

    <!-- App Store & Play Store Verified Ribbon -->
    <g transform="translate(0, 220)">
      <rect width="360" height="42" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#34d399" stroke-width="1.2"/>
      <text x="18" y="26" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">✓ SQA AUDITED: App Store &amp; Google Play Verified</text>
    </g>
  </g>
</svg>
